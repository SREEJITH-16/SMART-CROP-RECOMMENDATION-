{% extends "base.html" %}
{% block title %}{{ title }} &middot; Smart Crop Recommendation{% endblock %}

{% block content %}
<div class="container">
  <div class="page-head" style="max-width:38rem; margin-inline:auto">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if detail %}
    <p class="text-muted small"><strong>Details:</strong> {{ detail }}</p>
    {% endif %}
    <div class="hero-actions" style="justify-content:center">
      <a class="btn btn-primary" href="{{ url_for('home') }}">Go to the home page</a>
      <a class="btn btn-outline" href="{{ url_for('about') }}">Check system status</a>
    </div>
  </div>
</div>
{% endblock %}
